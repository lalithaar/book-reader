[package]
name = "book-reader"
version = "0.1.0"
description = "A quiet desktop reading app"
edition = "2021"

[lib]
name = "book_reader_lib"
path = "src/lib.rs"

[[bin]]
name = "book-reader"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
html-escape = "0.2"
encoding_rs = "0.8"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
rfd = "0.15"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
